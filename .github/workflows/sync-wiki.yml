name: Sync wiki

# Regla: todo lo que llega a la rama principal (main o master) con cambios
# en docs/wiki/ se publica en Morelo Wiki.
on:
  push:
    branches: [main, master]
    paths:
      - 'docs/wiki/**'
      - 'scripts/sync-wiki.ps1'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync ficha → morelo-wiki
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          SYNC_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: pwsh -NoProfile -File scripts/sync-wiki.ps1
